<div class="contact-page container py-5 text-light">
  <h2 class="text-center mb-4 contact-title">Contact Us</h2>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 500px;">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input
        id="name"
        formControlName="name"
        class="form-control"
        placeholder="Enter your name"
        [class.is-invalid]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched"
      />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        class="form-control"
        placeholder="Enter your email"
        [class.is-invalid]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched"
      />
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea
        id="message"
        formControlName="message"
        rows="4"
        class="form-control"
        placeholder="Write your message"
        [class.is-invalid]="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"
      ></textarea>
    </div>

    <button type="submit" class="btn btn-custom-purple w-100" [disabled]="isLoading">
      {{ isLoading ? 'Sending...' : 'Send Message' }}
    </button>

    <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">
      {{ errorMessage }}
    </div>
  </form>
</div>
