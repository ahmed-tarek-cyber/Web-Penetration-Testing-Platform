<div class="auth-page">
  <div class="auth-box">
    <h2 class="auth-title">Login</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group-custom">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          required
          class="auth-input"
        />
      </div>

      <div class="input-group-custom">
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          required
          class="auth-input"
        />
      </div>

      <button type="submit" class="btn auth-btn" [disabled]="loading">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="spinner-container">
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Logging in...
        </span>
      </button>
    </form>

    <p class="switch-text">
      Don’t have an account?
      <a (click)="goToRegister()" class="auth-link">Register here</a>
    </p>

    <div class="mt-3">
      <p *ngIf="message" class="info-box success-box animate-fade">{{ message }}</p>
      <p *ngIf="errorMessage" class="info-box error-box animate-fade">{{ errorMessage }}</p>
    </div>
  </div>
</div>
